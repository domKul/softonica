version: '3.8'

services:
  app:
    image: softonica-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softonica-backend
    depends_on:
      - mysql-db
      - redis
    ports:
      - "8087:8087"
    networks:
      - db-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/softonica
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_CACHE_REDIS_HOST: redis
      SPRING_CACHE_REDIS_PORT: 6379

  mysql-db:
    image: mysql:8.0
    container_name: softonica
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: softonica
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - db-network

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6378:6379"
    command: ["redis-server"]
    networks:
      - db-network

volumes:
  mysql-data:

networks:
  db-network:
